name: Feature request
description: Propose a focused improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or engineering problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and security impact
      description: Explain any effect on safety gates, NO_INTERVENTION, identity, data, or failure behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: The request does not depend on real customer data or unprovided operator contracts.
          required: true
        - label: The desired outcome can be tested or otherwise verified.
          required: true
