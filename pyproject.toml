[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confidence-layer"
version = "0.4.0"
description = "Confidence Layer - Production real-time safety-constrained decision platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "structlog>=24.1",
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
    "opentelemetry-exporter-otlp>=1.22",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "prometheus-client>=0.20",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "aiokafka>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.8",
    "ruff>=0.2",
    "aiosqlite>=0.20",
    "hypothesis>=6.98",
    "locust>=2.20",
    "fakeredis[lua]>=2.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/confidence", "demo"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "confluent_kafka.*",
    "redis.*",
    "fakeredis.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "locust.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
